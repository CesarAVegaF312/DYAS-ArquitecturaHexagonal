# Sistema completo: servicio de reservas + PostgreSQL.
#   cp .env.example .env
#   docker compose up --build -d
#   docker compose down -v      (apaga y borra los datos de PostgreSQL)
# Las variables con :? son obligatorias: si faltan en el .env, Compose se detiene con el mensaje indicado.
name: reservas-hexagonal

services:

  app:
    build: .
    environment:
      # Perfil que elige el adaptador de persistencia: memoria o postgres.
      SPRING_PROFILES_ACTIVE: ${PERSISTENCIA:-memoria}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-reservas}
      DB_USUARIO: ${POSTGRES_USER:?Defina POSTGRES_USER (ver .env.example)}
      DB_CLAVE: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD (ver .env.example)}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    # El healthcheck está definido en el Dockerfile (HEALTHCHECK).

  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reservas}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER (ver .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD (ver .env.example)}
    # Solo accesible desde la misma máquina (127.0.0.1), para consultar con un cliente SQL.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - datos-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  datos-postgres:
