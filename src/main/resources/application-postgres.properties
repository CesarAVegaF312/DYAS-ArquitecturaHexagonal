# Perfil postgres: la conexión llega por variables de entorno desde el .env.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/reservas}
spring.datasource.username=${DB_USUARIO:reservas}
spring.datasource.password=${DB_CLAVE:}
# Crea la tabla al arrancar si no existe (schema.sql usa IF NOT EXISTS).
spring.sql.init.mode=always
