spring.application.name=reservas
server.port=8080

# ---------- Adaptador de persistencia ----------
# El perfil elige el adaptador de salida: memoria (por defecto) o postgres.
# En Docker Compose llega por la variable SPRING_PROFILES_ACTIVE (ver compose.yaml y .env).
spring.profiles.default=memoria

# ---------- Errores ----------
# Respuestas de error con el formato Problem Details (RFC 9457) y sin la traza de la pila.
spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health
